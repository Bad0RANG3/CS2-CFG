//================================================================================
//  刀型循环切换（knife.cfg）
//--------------------------------------------------------------------------------
//  用法 : 输入 HD 绑定 [F2] 后，每次按 F2 切换一种刀型（循环到最后一把后回到第一把）；
//         也可以直接在控制台输入 dao 手动切换
//  说明 : 通过 subclass_create <刀型ID> 生成对应刀型，需要 sv_cheats 1
//  自定义 : 修改下方任一别名中的 ID 与名称即可定制你的刀型列表
//================================================================================
//  刀型 ID 对照表 :
//   500 刺刀          503 海豹短刀       505 折叠刀
//   506 穿肠刀        507 爪子刀         508 M9 刺刀
//   509 猎杀者匕首    512 弯刀           514 鲍伊猎刀
//   515 蝴蝶刀        516 暗影双匕       517 系绳匕首
//   518 求生匕首      519 熊刀           520 折刀
//   521 流浪者匕首    522 短剑           523 锯齿爪刀
//   525 骷髅匕首      526 新刀尼泊尔
//================================================================================

alias "dao"   "dao1"
alias "dao1"  "subclass_create 500; alias dao dao2; say 已生成刀：刺刀"
alias "dao2"  "subclass_create 503; alias dao dao3; say 已生成刀：海豹短刀"
alias "dao3"  "subclass_create 505; alias dao dao4; say 已生成刀：折叠刀"
alias "dao4"  "subclass_create 506; alias dao dao5; say 已生成刀：穿肠刀"
alias "dao5"  "subclass_create 507; alias dao dao6; say 已生成刀：爪子刀"
alias "dao6"  "subclass_create 508; alias dao dao7; say 已生成刀：M9 刺刀"
alias "dao7"  "subclass_create 509; alias dao dao8; say 已生成刀：猎杀者匕首"
alias "dao8"  "subclass_create 512; alias dao dao9; say 已生成刀：弯刀"
alias "dao9"  "subclass_create 514; alias dao dao10; say 已生成刀：鲍伊猎刀"
alias "dao10" "subclass_create 515; alias dao dao11; say 已生成刀：蝴蝶刀"
alias "dao11" "subclass_create 516; alias dao dao12; say 已生成刀：暗影双匕"
alias "dao12" "subclass_create 517; alias dao dao13; say 已生成刀：系绳匕首"
alias "dao13" "subclass_create 518; alias dao dao14; say 已生成刀：求生匕首"
alias "dao14" "subclass_create 519; alias dao dao15; say 已生成刀：熊刀"
alias "dao15" "subclass_create 520; alias dao dao16; say 已生成刀：折刀"
alias "dao16" "subclass_create 521; alias dao dao17; say 已生成刀：流浪者匕首"
alias "dao17" "subclass_create 522; alias dao dao18; say 已生成刀：短剑"
alias "dao18" "subclass_create 523; alias dao dao19; say 已生成刀：锯齿爪刀"
alias "dao19" "subclass_create 525; alias dao dao20; say 已生成刀：骷髅匕首"
alias "dao20" "subclass_create 526; alias dao dao1; say 已生成刀：新刀尼泊尔"
