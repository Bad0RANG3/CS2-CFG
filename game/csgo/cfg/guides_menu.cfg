//================================================================================
//  地图指南菜单（guides_menu.cfg）
//--------------------------------------------------------------------------------
//  用法 : 输入 guide（或 exec guides_menu），然后输入下方对应的 load_xxx 命令
//  说明 : 地图指南是游戏内的地图标注（annotation），文件存放在
//         game/csgo/annotations/local/<地图名>/<地图名>.txt
//  内置 : 7 张地图的指南（见下方）；新增指南后按相同格式添加 load_xxx 别名即可
//================================================================================
sv_allow_annotations_access_level 2
sv_annotation_limits_max_rounds_per_half -1 // 解除“仅半场前5回合显示指南”的限制
annotation_auto_load 1                // 进图自动加载本地地图指南（也可手动 load）

// 每张地图对应一个指南
alias load_dust2    "sv_allow_annotations_access_level 2; sv_annotation_limits_max_rounds_per_half -1; annotation_load de_dust2; say 已加载 炙热沙城 II 地图指南; exec showmenu"
alias load_inferno    "sv_allow_annotations_access_level 2; sv_annotation_limits_max_rounds_per_half -1; annotation_load de_inferno; say 已加载 炼狱小镇 地图指南; exec showmenu"
alias load_mirage    "sv_allow_annotations_access_level 2; sv_annotation_limits_max_rounds_per_half -1; annotation_load de_mirage; say 已加载 荒漠迷城 地图指南; exec showmenu"
alias load_nuke    "sv_allow_annotations_access_level 2; sv_annotation_limits_max_rounds_per_half -1; annotation_load de_nuke; say 已加载 核子危机 地图指南; exec showmenu"
alias load_ancient    "sv_allow_annotations_access_level 2; sv_annotation_limits_max_rounds_per_half -1; annotation_load de_ancient; say 已加载 远古遗迹 地图指南; exec showmenu"
alias load_anubis    "sv_allow_annotations_access_level 2; sv_annotation_limits_max_rounds_per_half -1; annotation_load de_anubis; say 已加载 阿努比斯 地图指南; exec showmenu"
alias load_overpass    "sv_allow_annotations_access_level 2; sv_annotation_limits_max_rounds_per_half -1; annotation_load de_overpass; say 已加载 死亡游乐园 地图指南; exec showmenu"

// 以下两张地图的指南未随仓库提供；本地存在对应标注文件后取消注释即可使用
// alias load_vertigo  "annotation_load de_vertigo; say 已加载 殒命大厦 地图指南; exec showmenu"
// alias load_train    "annotation_load de_train; say 已加载 列车停放站 地图指南; exec showmenu"

// 显示菜单的命令
alias guide_menu "exec guides_menu"

// 菜单显示文字
echoln "════════════════════════════════════════════════════════"
echoln "       地图指南选择菜单（输入以下命令加载）"
echoln "════════════════════════════════════════════════════════"
echoln "  load_dust2     →  炙热沙城 II 地图指南"
echoln "  load_inferno   →  炼狱小镇 地图指南"
echoln "  load_mirage    →  荒漠迷城 地图指南"
echoln "  load_nuke      →  核子危机 地图指南"
echoln "  load_ancient   →  远古遗迹 地图指南"
echoln "  load_anubis    →  阿努比斯 地图指南"
echoln "  load_overpass  →  死亡游乐园 地图指南"
echoln ""
echoln "  输入 showmenu 返回主菜单"
echoln "════════════════════════════════════════════════════════"
