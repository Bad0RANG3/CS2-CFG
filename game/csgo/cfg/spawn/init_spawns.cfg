//================================================================================
//  出生点占位初始化（spawn/init_spawns.cfg）
//--------------------------------------------------------------------------------
//  作用 : 预定义 CT1~CT15 / T1~T15 的占位别名（提示"没有这个出生点"），
//         地图文件加载后会用自己的真实坐标覆盖对应别名。
//         这样即使某张图只有 5 个 CT 出生点，误输 CT6 也只会得到提示而不是报错。
//  注意 : 由各地图文件自动加载（exec spawn/init_spawns.cfg），无需手动执行
//================================================================================

