//================================================================================
//  Shoots 出生点配置（spawn/shoots.cfg）
//--------------------------------------------------------------------------------
//  用法 : 输入 shoots 加载，然后输入 CT1~CT5 / T1~T5 传送
//  数量 : CT 5 个 · T 5 个
//================================================================================

// 初始化占位别名（覆盖不可用的出生点）
exec spawn/init_spawns.cfg

//-------------------------------------- CT 出生点 -------------------------------------------
alias "CT1" "setpos_exact 1600 1900 100;setang 0 270 0;say 已传送至: Shoots - CT点 1号位置"
alias "CT2" "setpos_exact 1600 1800 100;setang 0 270 0;say 已传送至: Shoots - CT点 2号位置"
alias "CT3" "setpos_exact 1600 1700 100;setang 0 270 0;say 已传送至: Shoots - CT点 3号位置"
alias "CT4" "setpos_exact 1500 1850 100;setang 0 270 0;say 已传送至: Shoots - CT点 4号位置"
alias "CT5" "setpos_exact 1500 1750 100;setang 0 270 0;say 已传送至: Shoots - CT点 5号位置"

//-------------------------------------- T 出生点 --------------------------------------------
alias "T1" "setpos_exact -1600 700 100;setang 0 90 0;say 已传送至: Shoots - T点 1号位置"
alias "T2" "setpos_exact -1600 600 100;setang 0 90 0;say 已传送至: Shoots - T点 2号位置"
alias "T3" "setpos_exact -1600 500 100;setang 0 90 0;say 已传送至: Shoots - T点 3号位置"
alias "T4" "setpos_exact -1500 650 100;setang 0 90 0;say 已传送至: Shoots - T点 4号位置"
alias "T5" "setpos_exact -1500 550 100;setang 0 90 0;say 已传送至: Shoots - T点 5号位置"

say "地图: Shoots | CT: 5个出生点 | T: 5个出生点"
