//================================================================================
//  清除投掷物（QC.cfg）
//--------------------------------------------------------------------------------
//  用法 : 输入 QC（或 exec QC）后，按 [.] 键清除场上所有投掷物及其特效
//  说明 : 通过 ent_fire 杀死所有投掷物实体，并停止相关音效，方便快速重置练习
//================================================================================
bind "." "ent_fire hegrenade_projectile kill; ent_fire flashbang_projectile kill; ent_fire smokegrenade_projectile kill; ent_fire decoy_projectile kill; ent_fire molotov_projectile kill; ent_fire incgrenade_projectile kill; ent_fire inferno kill; stopsound; say 已清除所有投掷物效果"
